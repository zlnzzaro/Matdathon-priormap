# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: priormap
metadata:
  template: priormap@0.0.1

infra:
  provider: bicep
  path: infra

services:
  api:
    project: .
    language: js
    host: appservice
    hooks:
      prepackage:
        shell: pwsh
        run: npm run build
